<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1c1b">
<title>Faxa — Alinhamento com Ricardo</title>
<link rel="preload" href="fonts/albert-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="topo" id="topo" hidden>
  <div class="topo-in">
    <button type="button" class="icone-btn" id="topo-voltar" aria-label="Voltar"></button>
    <p class="topo-ctx" id="topo-ctx"></p>
    <span class="topo-pct" id="barra-txt" aria-live="polite"></span>
    <button type="button" class="icone-btn" id="topo-menu" aria-label="Ver todos os assuntos"></button>
  </div>
  <div class="barra" role="progressbar" aria-label="Progresso do preenchimento" aria-valuemin="0" aria-valuemax="100" id="barra"><i id="barra-fill"></i></div>
</header>

<main id="conteudo" tabindex="-1"></main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Versão para impressão / PDF: preenchida ao pedir "Salvar como PDF" -->
<section id="impressao" class="so-impressao" aria-hidden="true"></section>

<script type="module" src="app.js"></script>
</body>
</html>
